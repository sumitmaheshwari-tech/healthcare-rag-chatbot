version: '3.8'

services:
  medcare-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medcare-assistant
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENV=production
      - PORT=8000
    volumes:
      # Persistent SQLite DB & ChromaDB Vector Store
      - ./hospital.db:/app/backend/hospital.db
      - ./chroma_db:/app/backend/chroma_db
      - ./checkpoints.db:/app/backend/checkpoints.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
