services:
  - type: web
    name: medcare-chatbot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && python -u main.py
    envVars:
      - key: PORT
        value: "8000"
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: LLM_PROVIDER
        value: "gemini"
      - key: LLM_MODEL
        value: "gemini-flash-latest"
      - key: EMBEDDING_MODEL
        value: "nvidia/nemotron-3-embed-1b:free"
      - key: OPENROUTER_MODEL
        value: "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free"
      - key: ENV
        value: "production"
      - key: COOKIE_SECURE
        value: "true"
      # Set these secrets via Render Dashboard (not in this file):
      # - GOOGLE_API_KEY
      # - OPENROUTER_API_KEY
      # - DATABASE_URL (auto-set when linking Render PostgreSQL)
      # - ENCRYPTION_KEY
      # - JWT_SECRET

databases:
  - name: medcare-db
    plan: free
    databaseName: medcare_hospital
    user: medcare_admin
